<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cacofone lyre logo">
  <g id="lyre" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- S-curved arms -->
    <path d="M20 18 C20.3 23 21 28.5 18 32 C12 40 15 47 23.5 48.5" fill="none" stroke-width="3.4"/>
    <path d="M44 18 C43.7 23 43 28.5 46 32 C52 40 49 47 40.5 48.5" fill="none" stroke-width="3.4"/>
    <!-- crossbar -->
    <path d="M20.8 22.5 H43.2" fill="none" stroke-width="2.6"/>
    <!-- tuning pegs -->
    <circle cx="26" cy="19.4" r="1.5" fill="currentColor" stroke="none"/>
    <circle cx="30" cy="19.4" r="1.5" fill="currentColor" stroke="none"/>
    <circle cx="34" cy="19.4" r="1.5" fill="currentColor" stroke="none"/>
    <circle cx="38" cy="19.4" r="1.5" fill="currentColor" stroke="none"/>
    <!-- round finials -->
    <circle cx="19.5" cy="15" r="3.4" fill="currentColor" stroke="none"/>
    <circle cx="44.5" cy="15" r="3.4" fill="currentColor" stroke="none"/>
    <!-- strings -->
    <path d="M26 22.5 V45 M30 22.5 V45 M34 22.5 V45 M38 22.5 V45" fill="none" stroke-width="1.3"/>
    <!-- base band -->
    <rect x="24" y="46" width="16" height="6" rx="3" fill="currentColor" fill-opacity="0.2" stroke-width="2.6"/>
  </g>
</svg>
